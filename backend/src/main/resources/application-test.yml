spring:
  datasource:
    url: jdbc:h2:mem:rag_aichat_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-for-unit-tests-must-be-long-enough-for-jwt-0123456789abcdef
    expiration-ms: 3600000
  upload:
    dir: ./target/test-uploads
